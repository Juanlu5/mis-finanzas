# Tests must never read, back up or prune the real ./data. DbBackupEnvironmentPostProcessor runs while the
# environment is being prepared (before @DynamicPropertySource applies), so the default has to be redirected here.
# A .properties file takes precedence over the main application.yml.
app.data-dir=target/test-data
logging.file.name=target/test-data/test.log
# MockMvc never starts a real server, and a context that did shouldn't need a certificate: HTTPS stays off in
# tests. TlsKeystoreEnvironmentPostProcessorTest covers the certificate generation on its own.
app.https.enabled=false
# Never reach real shops from tests: the automatic price check stays off (PriceCheckScheduler).
app.prices.scheduled=false
app.economy.scheduled=false
app.holidays.scheduled=false
app.prices.pause-between=PT0S
